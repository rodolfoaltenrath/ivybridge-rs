[package]
name = "ivybridge-rs"
version = "0.1.0"
edition = "2021"
description = "IvyBridge-RS Probe: diagnóstico de modos de vídeo para Intel HD Graphics 4000 (Gen7)"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[[bin]]
name = "ivyprobe"
path = "src/main.rs"

[lib]
name = "ivybridge_rs"
path = "src/lib.rs"

# 0.59 traz import libs prontas (windows-targets); 0.60+ usa raw-dylib, que no
# toolchain *-windows-gnu exige dlltool.exe instalado.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
]

[profile.release]
lto = true
codegen-units = 1
